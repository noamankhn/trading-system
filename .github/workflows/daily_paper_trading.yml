name: Daily Paper Trading Cycle

# Runs the paper trading cycle automatically every weekday, for free, using GitHub Actions
# instead of Render's Cron Job (which stopped being free in Render's April 2026 pricing change).
# This checks all symbols' signals and places/closes paper orders on your Alpaca account.

on:
  schedule:
    # 21:30 UTC = 4:30pm ET, Monday-Friday, shortly after US market close
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you also trigger it manually from the GitHub Actions tab

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python execution/paper_trader.py
