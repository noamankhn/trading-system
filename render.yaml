# Render deployment blueprint.
# Render reads this file automatically when you connect a repo ("Blueprints" / render.yaml).
# This defines ONE free-tier Cron Job that runs the paper-trading cycle on a schedule.

services:
  - type: cron
    name: paper-trading-cycle
    env: python
    plan: free
    schedule: "30 21 * * 1-5"   # 21:30 UTC = 4:30pm ET, Mon-Fri, shortly after US market close
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python execution/paper_trader.py"
    envVars:
      - key: ALPACA_API_KEY
        sync: false      # set manually in Render dashboard - never commit real keys to git
      - key: ALPACA_SECRET_KEY
        sync: false
