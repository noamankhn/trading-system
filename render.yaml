# Render deployment blueprint.
# Render reads this file automatically when you connect a repo ("Blueprints" / render.yaml).
# This defines ONE free-tier Cron Job that runs the paper-trading cycle on a schedule.

services:
  - type: web
    name: trading-dashboard
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python dashboard/app.py"
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
